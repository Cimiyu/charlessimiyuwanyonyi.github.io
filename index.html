<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charles Simiyu Wanyonyi — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F1;
    --paper-alt:#FFFFFF;
    --ink:#132A3A;
    --ink-soft:#3C4B57;
    --muted:#707D82;
    --accent:#8C2F1E;
    --line:#E2DED3;
    --radius:3px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12181C;
      --paper-alt:#171F24;
      --ink:#EDEFEF;
      --ink-soft:#C7CDCF;
      --muted:#8B979B;
      --accent:#E08A6E;
      --line:#2A3338;
    }
  }
  :root[data-theme="dark"]{
    --paper:#12181C;
    --paper-alt:#171F24;
    --ink:#EDEFEF;
    --ink-soft:#C7CDCF;
    --muted:#8B979B;
    --accent:#E08A6E;
    --line:#2A3338;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:78px;}
  body{
    background:var(--paper);
    color:var(--ink-soft);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  h1,h2,h3{
    font-family:'Source Serif 4',serif;
    color:var(--ink);
    font-weight:600;
    line-height:1.15;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}
  .wide{max-width:920px;margin:0 auto;padding:0 24px;}

  /* Nav */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    padding-top:env(safe-area-inset-top,0px);
    background:transparent;
    border-bottom:1px solid transparent;
    transition:background .3s ease, border-color .3s ease;
  }
  nav.scrolled{
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .navrow{
    max-width:920px;margin:0 auto;padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .navrow .mark{font-family:'Source Serif 4',serif;font-weight:600;font-size:1.05rem;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4);white-space:nowrap;transition:color .3s,text-shadow .3s;}
  nav.scrolled .mark{color:var(--ink);text-shadow:none;}
  .navlinks{display:flex;gap:22px;flex-wrap:wrap;font-size:0.9rem;}
  .navlinks a{text-decoration:none;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4);padding-bottom:3px;border-bottom:1px solid transparent;transition:border-color .15s, color .3s, text-shadow .3s;}
  nav.scrolled .navlinks a{color:var(--ink-soft);text-shadow:none;}
  .navlinks a:hover{color:var(--accent);border-color:var(--accent);}
  .navcta{font-size:0.85rem;white-space:nowrap;padding:8px 14px;border:1px solid #fff;border-radius:var(--radius);text-decoration:none;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4);transition:background .15s,color .3s,border-color .3s;}
  nav.scrolled .navcta{color:var(--ink);border-color:var(--ink);text-shadow:none;}
  .navcta:hover{background:var(--ink);color:var(--paper) !important;border-color:var(--ink);}

  /* Hero */
  .hero{
    position:relative;min-height:96vh;display:flex;align-items:flex-end;
    overflow:hidden;padding:0 0 64px;
  }
  .hero-bg{
    position:absolute;inset:0;background-size:cover;background-position:center 14%;
    opacity:.5;
  }
  .hero-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(19,42,58,.12) 0%, rgba(19,42,58,.02) 38%, var(--paper) 94%);
  }
  .hero-content{position:relative;z-index:1;}
  .eyebrow{color:var(--accent);font-size:0.85rem;letter-spacing:0.02em;margin-bottom:14px;}
  .hero h1{
    font-size:clamp(2.4rem,7vw,4.2rem);
    letter-spacing:0.01em;
    margin-bottom:14px;
    text-shadow:0 4px 30px rgba(19,42,58,.18);
  }
  .hero .role{color:var(--ink-soft);font-size:1.02rem;margin-bottom:16px;}
  .hero p.bio{max-width:56ch;margin-bottom:22px;}
  .hero-links{display:flex;flex-wrap:wrap;gap:10px;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:0.85rem;padding:8px 14px;border-radius:20px;
    border:1px solid var(--line);text-decoration:none;color:var(--ink-soft);
    transition:border-color .15s,color .15s;
  }
  .pill:hover{border-color:var(--accent);color:var(--accent);}
  .pill.solid{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .pill.solid:hover{opacity:.85;color:var(--paper);}

  section{padding:52px 0;border-top:1px solid var(--line);}
  section#about{padding-top:52px;}
  .section-head{margin-bottom:30px;}
  .section-head .num{color:var(--accent);font-family:'Source Serif 4',serif;font-size:0.85rem;margin-bottom:6px;display:block;}
  .section-head h2{font-size:1.55rem;}

  /* Academics timeline */
  .timeline{position:relative;padding-left:28px;}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line);}
  .tl-item{position:relative;margin-bottom:28px;}
  .tl-item:last-child{margin-bottom:0;}
  .tl-item::before{content:"";position:absolute;left:-28px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .tl-item h3{font-size:1.08rem;margin-bottom:2px;}
  .tl-meta{color:var(--muted);font-size:0.88rem;margin-bottom:6px;}

  /* Cards for activities/experience/projects */
  .stack{display:flex;flex-direction:column;gap:22px;}
  .card{
    background:var(--paper-alt);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
  }
  .card h3{font-size:1.05rem;margin-bottom:3px;}
  .card .meta{color:var(--muted);font-size:0.85rem;margin-bottom:8px;}
  .card p{font-size:0.95rem;}

  /* Certificates gallery */
  .reveal-btn{
    display:inline-flex;align-items:center;gap:10px;
    font-family:'IBM Plex Sans',sans-serif;font-size:0.95rem;font-weight:500;
    padding:14px 26px;border-radius:30px;border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);cursor:pointer;
    transition:background .2s,transform .15s,box-shadow .2s;
  }
  .reveal-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(19,42,58,.18);}
  .reveal-btn .count{
    background:rgba(255,255,255,.18);border-radius:14px;padding:2px 9px;font-size:0.8rem;
  }
  .reveal-btn svg{transition:transform .3s ease;}
  .reveal-btn.open svg{transform:rotate(180deg);}
  #cert-panel{
    max-height:0;overflow:hidden;
    transition:max-height .6s cubic-bezier(.4,0,.2,1);
  }
  #cert-panel.open{max-height:2400px;}
  #cert-panel-inner{padding-top:26px;}
  .cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:680px){.cert-grid{grid-template-columns:repeat(2,1fr);}}
  .cert{
    border:1px solid var(--line);background:var(--paper-alt);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;text-align:left;
    display:flex;flex-direction:column;
  }
  .cert img{aspect-ratio:4/3;object-fit:cover;width:100%;}
  .cert .capt{padding:10px 12px;font-size:0.78rem;color:var(--ink-soft);}
  .cert .capt b{display:block;font-size:0.82rem;color:var(--ink);margin-bottom:2px;}

  /* Lightbox */
  #lightbox{
    position:fixed;inset:0;background:rgba(10,14,16,.9);
    display:none;align-items:center;justify-content:center;z-index:100;padding:24px;
  }
  #lightbox.open{display:flex;}
  #lightbox img{max-width:min(92vw,900px);max-height:86vh;border-radius:4px;}
  #lightbox .close{position:absolute;top:22px;right:26px;color:#fff;font-size:1.6rem;cursor:pointer;background:none;border:0;line-height:1;}

  footer{padding:40px 0 calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:0.85rem;}

  ::selection{background:var(--accent);color:#fff;}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto;}}
</style>
</head>

  <div class="navrow">
    <span class="mark">Charles Simiyu Wanyonyi</span>
    <div class="navlinks">
      <a href="#about">About</a>
      <a href="#academics">Academics</a>
      <a href="#activities">Activities</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#certificates">Certificates</a>
    </div>
    <a class="navcta" href="#contact">Contact</a>
  </div>
</nav>
